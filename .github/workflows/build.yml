name: Build & Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      platforms:
        description: Build Windows only, or all original platforms
        type: choice
        options: [windows, all]
        default: windows

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: windows-electron-builder-${{ hashFiles('package-lock.json') }}
          restore-keys: windows-electron-builder-
      - run: npm ci
      - run: npm test
      - run: npm run fetch:sidecars -- --target windows-x64,windows-arm64
      - run: node scripts/verify-sidecar-binaries.js prebuild:win:all
      - run: npx electron-builder --win --publish never
      - name: Inspect packaged source, licenses, private data and architecture
        shell: pwsh
        run: |
          @'
          const fs = require('node:fs'), path = require('node:path'), crypto = require('node:crypto');
          const assert = require('node:assert/strict'), asar = require('@electron/asar'), yaml = require('js-yaml');
          const { PINNED_CHECKSUMS } = require('./scripts/fetch-sidecar-binaries');
          const version = require('./package.json').version;
          const results = [];
          for (const arch of ['x64', 'arm64']) {
            const root = path.join('dist', arch === 'x64' ? 'win-unpacked' : 'win-arm64-unpacked');
            const archive = path.join(root, 'resources', 'app.asar');
            const readPacked = file => asar.extractFile(archive, path.normalize(file));
            const entries = asar.listPackage(archive).map(name => name.replaceAll('\\', '/'));
            const forbidden = /(^|\/)(\.clawd-data|\.env|clawd-prefs\.json|chat-history\.json|chat-config\.json|chat-credentials\.json|.*\.dpapi)(\/|$)/i;
            assert.ok(!entries.some(name => forbidden.test(name)), 'Private data included');
            assert.equal(JSON.parse(readPacked('package.json')).version, version);
            const required = ['LICENSE', 'NOTICE.md', 'assets/LICENSE', 'src/raster-motion.js', 'src/updater.js', 'themes/naiwa/theme.json', 'themes/naiwa/THIRD-PARTY-NOTICES.md', 'themes/naiwa/UPSTREAM-LICENSE.txt'];
            for (const file of required) assert.ok(readPacked(file).length, 'Missing ' + file);
            for (const file of ['src/raster-motion.js', 'src/updater.js', 'themes/naiwa/theme.json']) {
              const normalize = data => data.toString('utf8').replace(/\r\n/g, '\n');
              assert.equal(normalize(readPacked(file)), normalize(fs.readFileSync(file)), 'Source mismatch: ' + file);
            }
            for (const name of ['idle', 'thinking', 'working', 'dozing', 'sleeping']) {
              const file = 'themes/naiwa/assets/naiwa-motion-' + name + '.png';
              assert.ok(readPacked(file).equals(fs.readFileSync(file)), 'Animation mismatch: ' + name);
            }
            const pe = fs.readFileSync(path.join(root, '奶蛙桌宠.exe'));
            assert.equal(pe.readUInt16LE(pe.readUInt32LE(0x3c) + 4), arch === 'x64' ? 0x8664 : 0xaa64);
            const updater = yaml.load(fs.readFileSync(path.join(root, 'resources', 'app-update.yml'), 'utf8'));
            assert.equal(updater.owner, 'bigSuai'); assert.equal(updater.repo, 'naiwa-desktop-pet');
            for (const sidecarArch of ['x64', 'arm64']) {
              const key = 'windows-' + sidecarArch + '/cc-connect-clawd.exe';
              const digest = crypto.createHash('sha256').update(fs.readFileSync(path.join(root, 'resources', 'sidecars', 'cc-connect-clawd', key))).digest('hex');
              assert.equal(digest, PINNED_CHECKSUMS[key]);
            }
            results.push({ arch, version, entries: entries.length, sourceVerified: true, privateDataAbsent: true, licensesPresent: true, sidecarsVerified: true });
          }
          fs.writeFileSync('dist/packaged-inspection.json', JSON.stringify(results, null, 2));
          console.log(JSON.stringify(results));
          '@ | node
      - name: Smoke-test the packaged Windows x64 app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist/win-unpacked/奶蛙桌宠.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Packaged app missing' }
          $process = Start-Process -FilePath $exe -WindowStyle Hidden -PassThru -RedirectStandardOutput dist/smoke-stdout.log -RedirectStandardError dist/smoke-stderr.log
          try {
            $healthy = $false
            for ($i = 0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 1
              if ($process.HasExited) { throw "Packaged app exited: $($process.ExitCode)" }
              try {
                $health = Invoke-RestMethod -Uri http://127.0.0.1:23333/state -TimeoutSec 2
                if ($health.ok -and $health.app -eq 'clawd-on-desk') { $healthy = $true; break }
              } catch {}
            }
            if (!$healthy) { throw 'Packaged app did not become healthy' }
            Start-Sleep -Seconds 5
            if ($process.HasExited) { throw 'Packaged app exited after startup' }
            Write-Output 'Packaged Windows x64 startup and health check passed.'
          } finally {
            Get-Process | Where-Object { $_.Path -eq $exe } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 1
            if (Get-Process | Where-Object { $_.Path -eq $exe }) { throw 'Smoke-test processes did not stop' }
          }
      - name: Write Windows checksums
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          foreach ($arch in @('x64', 'arm64')) {
            foreach ($kind in @('Setup', 'Portable')) {
              if (!(Test-Path -LiteralPath "dist/Naiwa-Desktop-Pet-$kind-$version-$arch.exe")) { throw "Missing $kind / $arch" }
            }
            if (!(Test-Path -LiteralPath "dist/Naiwa-Desktop-Pet-Setup-$version-$arch.exe.blockmap")) { throw "Missing blockmap / $arch" }
          }
          if (!(Test-Path -LiteralPath dist/latest.yml)) { throw 'Missing update metadata' }
          $files = Get-ChildItem -LiteralPath dist -File | Where-Object { $_.Name -match '^(Naiwa-Desktop-Pet-.*\.exe(\.blockmap)?|latest\.yml)$' } | Sort-Object Name
          if ($files.Name -contains "Naiwa-Desktop-Pet-Portable-$version.exe") { throw 'Unexpected universal portable build' }
          $lines = foreach ($file in $files) { '{0}  {1}' -f (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $file.Name }
          $lines | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-verification
          path: |
            dist/packaged-inspection.json
            dist/SHA256SUMS.txt
            dist/latest.yml

  build-mac:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run fetch:sidecars -- --target darwin-x64,darwin-arm64
      - run: node scripts/verify-sidecar-binaries.js prebuild:mac
      - run: npx electron-builder --mac --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: mac-installer
          path: |
            dist/*.dmg
            dist/latest-mac.yml

  build-linux:
    if: github.event_name == 'workflow_dispatch' && inputs.platforms == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run fetch:sidecars -- --target linux-x64
      - run: node scripts/verify-sidecar-binaries.js prebuild:linux
      - run: npx electron-builder --linux --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-installer
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          body_path: docs/releases/release-${{ github.ref_name }}.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
