<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240"><title>Naiwa mini-sleep continuous motion</title><defs><clipPath id="torso"><rect width="180" height="136"/></clipPath><clipPath id="leg-l"><rect y="132" width="94" height="48"/></clipPath><clipPath id="leg-r"><rect x="94" y="132" width="86" height="48"/></clipPath></defs><style>.float{animation:float 2.6s ease-in-out infinite}.swing{transform-origin:120px 68px;animation:swing 3.6399999999999997s ease-in-out infinite}.elastic{transform-origin:120px 200px;animation:elastic 2.6s ease-in-out infinite}.leg-l{transform-origin:82px 132px;animation:leg 1.6900000000000002s ease-in-out infinite alternate}.leg-r{transform-origin:105px 132px;animation:leg 1.6900000000000002s ease-in-out infinite alternate-reverse}.accent{animation:accent 2.6s ease-in-out infinite}.note{animation:accent 1.8s ease-in-out infinite reverse}.ball{transform-origin:120px 70px;animation:orbit 2.8s linear infinite}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.2px)}}@keyframes swing{0%,100%{transform:rotate(-1.8deg)}50%{transform:rotate(1.8deg)}}@keyframes elastic{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.982)}}@keyframes leg{from{transform:rotate(-2deg)}to{transform:rotate(2deg)}}@keyframes accent{0%,100%{opacity:.45;transform:translateY(2px)}50%{opacity:1;transform:translateY(-4px)}}@keyframes orbit{to{transform:rotate(360deg)}}</style><ellipse cx="120" cy="222" rx="44" ry="4" fill="#29433e" opacity=".12"/><g class="float"><g class="swing"><g class="elastic"><g transform="translate(10 2) scale(1.2222)"><image width="180" height="180" href="data:image/png;base64,"/></g></g></g></g><g class="note" fill="#7fa99b"><text x="160" y="106" font-size="17">z</text><text x="181" y="83" font-size="20">z</text><text x="199" y="57" font-size="23">Z</text></g></svg>